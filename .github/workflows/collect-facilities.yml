name: Geocode Mapo security lights (file validation)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geocode-security-lights
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: .cache/security-light-geocode.json
          key: mapo-address-geocode-v1-${{ github.run_id }}
          restore-keys: mapo-address-geocode-v1-
      - name: Convert public facility addresses (no DB writes)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python backend/geocode_security_lights.py --input backend/data/mapo-security-lights-20251209.csv --output-dir geocode-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapo-security-light-geocode
          path: geocode-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          if [ -f geocode-output/summary.json ]; then
            echo '### Security light address conversion' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat geocode-output/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
