name: Collect safety facilities

on:
  push:
    branches: [main]
    paths:
      - 'backend/data/security-lights-input.csv'
      - 'backend/data/streetlights-input.csv'
  workflow_dispatch:
    inputs:
      source:
        description: '수집할 시설 (all: 전체, files: 조명 파일만)'
        type: choice
        default: all
        options: [all, files, security_light, streetlight, cctv, convenience, police]
  schedule:
    # Every Tuesday at 03:17 Asia/Seoul.
    - cron: '17 18 * * 1'

permissions:
  contents: read

concurrency:
  group: facility-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'schedule' || vars.FACILITY_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || '4000' }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: 'true'
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      STREETLIGHT_CSV_URL: ${{ vars.STREETLIGHT_CSV_URL }}
      STREETLIGHT_DATA_DATE: ${{ vars.STREETLIGHT_DATA_DATE }}
      HONGDAE_CENTER_LAT: ${{ vars.HONGDAE_CENTER_LAT || '37.5572' }}
      HONGDAE_CENTER_LNG: ${{ vars.HONGDAE_CENTER_LNG || '126.9245' }}
      GRID_RADIUS_KM: ${{ vars.GRID_RADIUS_KM || '1.0' }}
      GRID_LAT_SIZE: ${{ vars.GRID_LAT_SIZE || '0.0009' }}
      GRID_LNG_SIZE: ${{ vars.GRID_LNG_SIZE || '0.0011' }}
      POLICE_COLLECTION_RADIUS_M: ${{ vars.POLICE_COLLECTION_RADIUS_M || '2000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect and verify facilities
        env:
          SELECTED_SOURCE: ${{ github.event_name == 'push' && 'files' || inputs.source || 'all' }}
        run: python run_facility_automation.py --source "$SELECTED_SOURCE" --output-dir facility-output
      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facility-collection-results
          path: backend/facility-output/
          retention-days: 30
          if-no-files-found: warn
      - name: Collection summary
        if: always()
        run: |
          if [ -f facility-output/summary.json ]; then
            echo '### 안전 시설 수집 결과' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat facility-output/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
